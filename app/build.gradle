plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fyooriz.visualstudioacode'
    compileSdk 35

    defaultConfig {
        applicationId 'com.fyooriz.visualstudioacode'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.2.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
