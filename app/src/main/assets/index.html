<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Visual Studio Acode</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <button class="icon" id="menu" aria-label="Menu">☰</button>
    <div class="brand"><strong>Visual Studio Acode</strong><span id="workspace">No workspace</span></div>
    <button class="icon" id="run" aria-label="Run">▶</button>
    <button class="icon" id="more" aria-label="More">⋮</button>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <main class="editor-wrap">
    <div class="gutter" id="gutter"></div>
    <textarea id="editor" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off">// Visual Studio Acode foundation
// Editor, LSP, terminal, preview, DevTools, Git, database and AI
// engines will connect through stable internal interfaces.

function hello() {
  return "Visual Studio Acode";
}

console.log(hello());
</textarea>
  </main>

  <footer class="statusbar">
    <span id="language">JavaScript</span><span>Spaces: 2</span><span>UTF-8</span><span id="position">Ln 1, Col 1</span>
  </footer>

  <section class="palette hidden" id="palette">
    <input id="command" placeholder="Type a command…" />
    <div class="command-list">
      <button>Open Folder</button><button>Search in Workspace</button><button>Run File</button><button>Toggle Terminal</button><button>Format Document</button>
    </div>
  </section>
  <script src="app.js"></script>
</body>
</html>
