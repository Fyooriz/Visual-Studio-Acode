<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'; frame-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none';">
  <title>Visual Studio Acode</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <button class="icon" id="menu" aria-label="Open menu">☰</button>
    <div class="brand"><strong>Visual Studio Acode</strong><span id="workspace">No workspace</span></div>
    <button class="icon" id="project" aria-label="Project explorer">▦</button>
    <button class="icon" id="save" aria-label="Save">⌑</button>
    <button class="icon" id="run" aria-label="Preview">▶</button>
    <button class="icon" id="more" aria-label="More">⋮</button>
  </header>

  <nav class="tabs" id="tabs" aria-label="Open files"></nav>

  <main class="editor-wrap">
    <div class="gutter" id="gutter" aria-hidden="true"></div>
    <textarea id="editor" class="editor" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off" aria-label="Code editor" aria-multiline="true"></textarea>
  </main>

  <section class="panel hidden" id="panel" aria-live="polite">
    <div class="panel-head">
      <strong id="panel-title">Command Palette</strong>
      <button id="panel-close" aria-label="Close panel">×</button>
    </div>
    <input id="command" class="command-input" placeholder="Type a command…" autocomplete="off">
    <div class="command-list" id="command-list"></div>
    <div class="panel-body hidden" id="preview-body"></div>
  </section>

  <footer class="statusbar">
    <span id="language">Plain Text</span>
    <span id="indent">Spaces: 2</span>
    <span id="diagnostics-count">0 problems</span>
    <span>UTF-8</span>
    <span id="dirty">Saved</span>
    <span id="position">Ln 1, Col 1</span>
  </footer>

  <div id="toast" class="toast hidden"></div>
  <script src="platform/snippet-registry.js"></script>
  <script src="platform/editor-engine.js"></script>
  <script src="platform/diagnostics.js"></script>
  <script src="platform/devtools.js"></script>
  <script src="platform/language-runtime.js"></script>
  <script src="app.js"></script>
  <script src="platform/project-workspace.js"></script>
  <script src="platform/editor-actions.js"></script>
  <script src="platform/editor-format.js"></script>
  <script src="platform/app-shell-compat.js"></script>
</body>
</html>
